const allStores = stores;
const catColors={cafe:"#c0392b",bakery:"#e67e22",food:"#2980b9",shop:"#8e44ad"};
let map, markers=[], activeCat="all", userLat=null, userLng=null, userMarker=null, accCircle=null, wonRate=null;

function catLabel(c){return{cafe:"カフェ",bakery:"ベーカリー",food:"グルメ",shop:"ショップ"}[c]||c}
function calcDist(la1,ln1,la2,ln2){const R=6371000,dL=(la2-la1)*Math.PI/180,dG=(ln2-ln1)*Math.PI/180;const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function fmtDist(m){return m<1000?Math.round(m)+"m":(m/1000).toFixed(1)+"km"}
function showToast(msg,dur){dur=dur||2500;const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},dur);}

function makeIcon(s){
  const col=catColors[s.cat];
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48"><path d="M20 0C9 0 0 9 0 20c0 15 20 28 20 28s20-13 20-28C40 9 31 0 20 0z" fill="'+col+'" stroke="white" stroke-width="2.5"/><text x="20" y="27" text-anchor="middle" font-size="17">'+s.emoji+'</text></svg>';
  try{
    return {
      url: 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg))),
      scaledSize: new google.maps.Size(40,48),
      anchor: new google.maps.Point(20,48)
    };
  }catch(e){
    return {
      url: 'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48"><path d="M20 0C9 0 0 9 0 20c0 15 20 28 20 28s20-13 20-28C40 9 31 0 20 0z" fill="'+col+'" stroke="white" stroke-width="2.5"/><circle cx="20" cy="20" r="8" fill="white"/></svg>'),
      scaledSize: new google.maps.Size(40,48),
      anchor: new google.maps.Point(20,48)
    };
  }
}

function initMap(){
  map = new google.maps.Map(document.getElementById("map"),{
    center:{lat:37.5253,lng:127.0365},
    zoom:14,
    mapTypeControl:false,
    streetViewControl:false,
    fullscreenControl:false
  });
  renderMarkers();
  fetchWonRate();
}

function renderMarkers(){
  for(var i=0;i<markers.length;i++){markers[i].setMap(null);}
  markers=[];
  var vis=[];
  for(var i=0;i<allStores.length;i++){
    if(activeCat==="all"||allStores[i].cat===activeCat) vis.push(allStores[i]);
  }
  document.getElementById("countBadge").textContent=vis.length+" 件";
  for(var i=0;i<vis.length;i++){
    (function(s){
      try{
        var m=new google.maps.Marker({
          position:{lat:s.lat,lng:s.lng},
          map:map,
          icon:makeIcon(s),
          title:s.name.replace(/[&<>"']/g,' '),
          optimized:false
        });
        m.addListener("click",function(){openPanel(s.id);});
        markers.push(m);
      }catch(e){console.warn('Marker error for store '+s.id+':'+e.message);}
    })(vis[i]);
  }
}

function filterCat(cat,el){
  activeCat=cat;
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove("active");
  el.classList.add("active");
  renderMarkers();
}

function getNearby(excludeId,limit){
  limit=limit||4;
  if(userLat===null)return[];
  var arr=[];
  for(var i=0;i<allStores.length;i++){
    var s=allStores[i];
    if(s.id!==excludeId) arr.push({s:s,dist:calcDist(userLat,userLng,s.lat,s.lng)});
  }
  arr.sort(function(a,b){return a.dist-b.dist;});
  var result=[];
  for(var i=0;i<Math.min(limit,arr.length);i++) result.push(arr[i]);
  return result;
}

function openPanel(id){
  var s=null;
  for(var i=0;i<allStores.length;i++){if(allStores[i].id===id){s=allStores[i];break;}}
  if(!s)return;
  var dist=userLat!==null?calcDist(userLat,userLng,s.lat,s.lng):null;
  var nearby=getNearby(id);
  var html='';
  html+='<div class="ph"><div class="pemoji">'+s.emoji+'</div><div style="flex:1">';
  html+='<div class="ptitle">'+s.name+'</div>';
  html+='<div class="pname-en">'+s.nameEn+'</div>';
  html+='<div class="badges">';
  html+='<span class="badge bc">'+catLabel(s.cat)+'</span>';
  if(s.area) html+='<span class="badge bc">'+s.area+'</span>';
  if(s.isHot) html+='<span class="badge bh">🔥 人気店</span>';
  if(s.wait) html+='<span class="badge bw">⏱️ 行列情報</span>';
  if(dist!==null) html+='<span class="badge bd">📍 '+fmtDist(dist)+'</span>';
  html+='</div></div></div>';
  if(s.note) html+='<div class="note-box">'+s.note+'</div>';

async function fetchWonRate(){
  try{var res=await fetch("https://open.er-api.com/v6/latest/KRW");var data=await res.json();if(data&&data.rates&&data.rates.JPY)wonRate=data.rates.JPY;}catch(e){wonRate=0.011;}
}

function calcWon(id){
  var input=document.getElementById("wonInput_"+id);
  var result=document.getElementById("wonResult_"+id);
  var rateEl=document.getElementById("wonRate_"+id);
  var won=parseFloat(input.value);
  if(!wonRate){result.textContent="取得中";return;}
  rateEl.textContent="1₩ ≈ "+wonRate.toFixed(4)+"円（リアルタイム）";
  if(isNaN(won)||input.value===""){result.textContent="— 円";return;}
  result.textContent=Math.round(won*wonRate).toLocaleString()+" 円";
}

function locateMe(){
  if(!navigator.geolocation){showToast("⚠️ 位置情報が使えません");return;}
  var btn=document.getElementById("gpsBtn");
  btn.textContent="⏳";
  showToast("📡 現在地を取得中…",5000);
  navigator.geolocation.getCurrentPosition(
    function(pos){
      userLat=pos.coords.latitude;userLng=pos.coords.longitude;
      var acc=pos.coords.accuracy;
      if(userMarker)userMarker.setMap(null);
      if(accCircle)accCircle.setMap(null);
      accCircle=new google.maps.Circle({map:map,center:{lat:userLat,lng:userLng},radius:acc,strokeColor:"#1976d2",fillColor:"#42a5f5",fillOpacity:.12,strokeWeight:1.5});
      var el=document.createElement("div");
      el.style.cssText="width:16px;height:16px;background:#1976d2;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(25,118,210,.6)";
      userMarker=new google.maps.Marker({
        position:{lat:userLat,lng:userLng},map:map,
        icon:{url:"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8" fill="#1976d2" stroke="white" stroke-width="3"/></svg>'),scaledSize:new google.maps.Size(20,20),anchor:new google.maps.Point(10,10)},
        title:"現在地",zIndex:9999
      });
      map.panTo({lat:userLat,lng:userLng});map.setZoom(16);
      btn.classList.add("located");btn.textContent="🔵";
      showToast("📍 現在地取得（精度 ±"+Math.round(acc)+"m）");
    },
    function(err){
      btn.textContent="📍";
      var m={1:"⚠️ 位置情報の許可が必要です",2:"⚠️ 取得できませんでした",3:"⚠️ タイムアウト"};
      showToast(m[err.code]||"⚠️ エラー",4000);
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function openMemo(){
  var body=document.getElementById("memoBody");

  for(var i=0;i<memoItems.length;i++){

    if(item.isHeader){
      html+='<div class="memo-header-card">';

      html+='<div class="memo-header-card-title">'+item.name+'</div>';
      html+='<div class="memo-header-card-text">'+item.text+'</div>';
      html+='</div>';
    } else {
      html+='<div class="memo-item">';
      html+='<div class="memo-item-header">';
      html+='<span class="memo-item-emoji">'+item.emoji+'</span>';
      html+='<span class="memo-item-name">'+item.name+'</span>';
      html+='<button class="memo-map-btn" onclick="jumpToStore('+item.id+')">🗺️ MAPへ</button>';
      html+='</div>';
      html+='<div class="memo-item-area">📍 '+item.area+'</div>';
      html+='<div class="memo-item-text">'+item.text+'</div>';
      html+='</div>';
    }
  }
  body.innerHTML=html;
  document.getElementById("memoPage").classList.add("open");
}
function closeMemo(){document.getElementById("memoPage").classList.remove("open");}
function jumpToStore(id){
  closeMemo();
  var store=null;
  for(var i=0;i<allStores.length;i++){if(allStores[i].id===id){store=allStores[i];break;}}
  if(!store)return;
  setTimeout(function(){map.panTo({lat:store.lat,lng:store.lng});map.setZoom(17);openPanel(id);},300);
}
